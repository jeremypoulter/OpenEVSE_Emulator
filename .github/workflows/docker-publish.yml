name: Docker Build and Publish

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # The firmware built into the image for engine mode; see tests.yml.
  FIRMWARE_REPO: ${{ vars.FIRMWARE_REPO || 'jeremypoulter/open_evse' }}
  FIRMWARE_REF: ${{ vars.FIRMWARE_REF || 'feat/native-target' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with 'latest' on main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with 'develop' on develop branch
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            # Tag with version on tags (e.g., v1.0.0 -> 1.0.0)
            type=semver,pattern={{version}}
            # Tag with major.minor on tags (e.g., v1.0.0 -> 1.0)
            type=semver,pattern={{major}}.{{minor}}
            # Tag with major on tags (e.g., v1.0.0 -> 1)
            type=semver,pattern={{major}}
            # Tag with SHA for pull requests
            type=sha,enable=${{ github.event_name == 'pull_request' }}
          labels: |
            org.opencontainers.image.title=OpenEVSE Emulator
            org.opencontainers.image.description=Software emulator for OpenEVSE electric vehicle charging station
            org.opencontainers.image.vendor=Jeremy Poulter
            org.opencontainers.image.licenses=MIT

      # Build from an exact firmware commit, not a branch name: the image
      # then cannot carry older firmware than the checkout the tests used.
      - name: Resolve firmware commit
        id: firmware
        run: |
          ref="${FIRMWARE_REF}"
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            ref="$(git ls-remote "https://github.com/${FIRMWARE_REPO}.git" "$ref" | head -1 | cut -f1)"
          fi
          test -n "$ref" || { echo "cannot resolve ${FIRMWARE_REF} in ${FIRMWARE_REPO}" >&2; exit 1; }
          echo "commit=$ref" >> "$GITHUB_OUTPUT"
          echo "Firmware: ${FIRMWARE_REPO}@${ref} (${FIRMWARE_REF})" >> "$GITHUB_STEP_SUMMARY"

      # Build one platform into the local daemon first and prove engine mode
      # works in the image, before spending time on the multi-platform push.
      # The layers are shared through the cache, so the real build below is
      # mostly a cache hit.
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: openevse-emulator:smoke
          build-args: |
            FIRMWARE_REPO=${{ env.FIRMWARE_REPO }}
            FIRMWARE_REF=${{ steps.firmware.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test engine mode
        run: scripts/docker-smoke.sh openevse-emulator:smoke

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            FIRMWARE_REPO=${{ env.FIRMWARE_REPO }}
            FIRMWARE_REF=${{ steps.firmware.outputs.commit }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
