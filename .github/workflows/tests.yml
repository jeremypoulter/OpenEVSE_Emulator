name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# The firmware that engine mode runs, built natively. Until the native target
# is merged into OpenEVSE/open_evse this points at the PR branch; set the
# FIRMWARE_REPO / FIRMWARE_REF repository variables to follow it elsewhere.
env:
  FIRMWARE_REPO: ${{ vars.FIRMWARE_REPO || 'jeremypoulter/open_evse' }}
  FIRMWARE_REF: ${{ vars.FIRMWARE_REF || 'feat/native-target' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=term-missing

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      if: matrix.python-version == '3.14'
      with:
        fail_ci_if_error: false

  # Build the real safety firmware for the host, once, and share it: the engine
  # tests below use it, and it is kept as an artifact so a failing run can be
  # reproduced locally against the very binaries CI used.
  firmware:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the firmware
      uses: actions/checkout@v7
      with:
        repository: ${{ env.FIRMWARE_REPO }}
        ref: ${{ env.FIRMWARE_REF }}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Cache PlatformIO
      uses: actions/cache@v5
      with:
        path: ~/.platformio
        key: platformio-native-${{ runner.os }}-${{ hashFiles('platformio.ini', 'firmware/targets/native/platformio.ini') }}

    - name: Build native firmware
      run: |
        pip install platformio
        pio run -e native_oev6 -e native_nxt
        mkdir -p native-firmware
        cp .pio/build/native_oev6/program native-firmware/native_oev6
        cp .pio/build/native_nxt/program native-firmware/native_nxt

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: native-firmware
        path: native-firmware/
        if-no-files-found: error

  # The whole suite against the real firmware as well as the Python EVSE. The
  # engine tests skip when no binary is found; here that must be a failure, or
  # a broken firmware build would turn this job green by testing nothing.
  engine-tests:
    needs: firmware
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Download firmware
      uses: actions/download-artifact@v4
      with:
        name: native-firmware
        path: native-firmware

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run engine and conformance tests
      env:
        OPENEVSE_NATIVE_DIR: ${{ github.workspace }}/native-firmware
        OPENEVSE_REQUIRE_ENGINE: "1"
      run: |
        chmod +x native-firmware/*
        pytest tests/ -v -rsxX

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        allow-prereleases: true

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black

    - name: Run flake8
      run: |
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ tests/ --count --statistics

    - name: Check code formatting with black
      run: |
        black --check src/ tests/

  markdown-lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Run markdownlint
      uses: DavidAnson/markdownlint-cli2-action@v24.2.0
      with:
        globs: '**/*.md'
